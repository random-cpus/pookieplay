<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="450" height="450" fill="none">
  <defs>
    <linearGradient id="stadiumGrad" x1="0" y1="0" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="0.6" stop-color="#1e293b" />
      <stop offset="1" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="phoneBorderGrad" x1="0" y1="0" x2="240" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#c084fc" />
      <stop offset="1" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="450" height="450" rx="16" fill="url(#stadiumGrad)" />
  
  <!-- Stadium crowd & floodlights effect -->
  <circle cx="80" cy="80" r="60" fill="#38bdf8" opacity="0.15" filter="blur(20px)" />
  <circle cx="370" cy="90" r="70" fill="#c084fc" opacity="0.15" filter="blur(20px)" />
  <path d="M0 320 Q225 290 450 320 L450 450 L0 450 Z" fill="#047857" opacity="0.4" />

  <!-- Hand Holding Phone Frame -->
  <g transform="translate(105, 35)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="240" height="380" rx="28" fill="#09090b" stroke="url(#phoneBorderGrad)" stroke-width="4" />
    <rect x="12" y="14" width="216" height="352" rx="20" fill="#18181b" />
    
    <!-- Phone Top Notch -->
    <rect x="80" y="20" width="80" height="12" rx="6" fill="#09090b" />
    
    <!-- App UI Mockup -->
    <!-- App Header -->
    <rect x="24" y="44" width="192" height="32" rx="6" fill="#27272a" />
    <text x="36" y="65" fill="#e879f9" font-family="sans-serif" font-size="12" font-weight="900">POOKIE PLAY</text>
    
    <!-- Match Card 1 -->
    <rect x="24" y="86" width="192" height="64" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
    <text x="36" y="108" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">IND vs AUS</text>
    <text x="36" y="125" fill="#22c55e" font-family="sans-serif" font-size="10">LIVE 248/4 (42.1)</text>
    <rect x="145" y="98" width="60" height="24" rx="4" fill="#c026d3" />
    <text x="175" y="114" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">1.85</text>

    <!-- Match Card 2 -->
    <rect x="24" y="160" width="192" height="64" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
    <text x="36" y="182" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">ENG vs SA</text>
    <text x="36" y="199" fill="#9ca3af" font-family="sans-serif" font-size="10">Today 19:30 IST</text>
    <rect x="145" y="172" width="60" height="24" rx="4" fill="#27272a" stroke="#a855f7" stroke-width="1" />
    <text x="175" y="188" text-anchor="middle" fill="#e879f9" font-family="sans-serif" font-size="10" font-weight="700">2.10</text>

    <!-- App Bottom Nav -->
    <rect x="24" y="326" width="192" height="30" rx="6" fill="#27272a" />
    <circle cx="60" cy="341" r="5" fill="#c026d3" />
    <circle cx="120" cy="341" r="5" fill="#71717a" />
    <circle cx="180" cy="341" r="5" fill="#71717a" />
  </g>
</svg>
