<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b0764" />
      <stop offset="0.5" stop-color="#581c87" />
      <stop offset="1" stop-color="#7e22ce" />
    </linearGradient>
  </defs>
  <rect width="360" height="180" rx="12" fill="url(#bgGrad2)" />
  
  <g transform="translate(130, 18)">
    <!-- Money bag / piggy / coins -->
    <ellipse cx="20" cy="24" rx="12" ry="10" fill="#f472b6" />
    <circle cx="20" cy="12" r="6" fill="#fbbf24" />
    <circle cx="34" cy="28" r="4" fill="#fbbf24" />
    
    <!-- Phone -->
    <rect x="55" y="6" width="24" height="38" rx="3" fill="#1e1e24" stroke="#c084fc" stroke-width="1.5" />
    <rect x="59" y="12" width="16" height="24" fill="#581c87" />
  </g>

  <!-- Card Title -->
  <text x="180" y="115" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">TOP 5 MISTAKES NEW</text>
  <text x="180" y="135" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">BETTORS MAKE</text>
  <text x="180" y="155" text-anchor="middle" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">AND HOW TO AVOID THEM</text>
</svg>
