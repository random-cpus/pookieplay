<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b0764" />
      <stop offset="0.5" stop-color="#581c87" />
      <stop offset="1" stop-color="#7e22ce" />
    </linearGradient>
  </defs>
  <rect width="360" height="180" rx="12" fill="url(#bgGrad1)" />
  
  <!-- Subtle decorative particles -->
  <circle cx="40" cy="30" r="3" fill="#e879f9" opacity="0.4" />
  <circle cx="320" cy="40" r="4" fill="#e879f9" opacity="0.3" />
  <circle cx="340" cy="140" r="2" fill="#e879f9" opacity="0.5" />

  <!-- Icons: Soccer ball, dice, cards, phone -->
  <g transform="translate(110, 20)">
    <!-- Soccer ball -->
    <circle cx="15" cy="20" r="10" fill="#ffffff" />
    <circle cx="15" cy="20" r="8" stroke="#1e1e24" stroke-width="2" fill="none" />
    
    <!-- Equal / VS -->
    <text x="35" y="25" fill="#e879f9" font-family="sans-serif" font-size="14" font-weight="900">=</text>

    <!-- Cards / Chips -->
    <rect x="55" y="10" width="18" height="24" rx="2" fill="#ffffff" transform="rotate(-15 55 10)" />
    <rect x="65" y="10" width="18" height="24" rx="2" fill="#f43f5e" transform="rotate(10 65 10)" />

    <!-- Phone -->
    <rect x="100" y="8" width="22" height="36" rx="3" fill="#1e1e24" stroke="#a855f7" stroke-width="1.5" />
    <rect x="104" y="14" width="14" height="22" fill="#3b0764" />
  </g>

  <!-- Card Title -->
  <text x="180" y="115" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.5">SPORTS BETTING VS</text>
  <text x="180" y="135" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.5">CASINO GAMBLING</text>
  <text x="180" y="155" text-anchor="middle" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">What's the Difference?</text>
</svg>
